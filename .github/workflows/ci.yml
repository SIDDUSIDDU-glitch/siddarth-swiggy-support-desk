name: CI Pipeline - Swiggy Support Desk AI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Unit & Integration Tests
      run: |
        python -m unittest discover tests

    - name: Run 20-Message Automated Benchmark
      run: |
        python -c "from src.benchmark import BenchmarkRunner; res = BenchmarkRunner().run_benchmark(); assert res['pass_count'] == 20, f'Expected 20 passes but got {res[\"pass_count\"]}'"
